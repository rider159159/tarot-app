# Production stack for self-hosting on the OCI ARM (aarch64) machine.
# Dev stack lives in docker-compose.yml — do not mix the two.
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env (never committed). See .env.example for required keys.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC_* are inlined into the SvelteKit bundle at BUILD time.
        # They must be passed as build args, not runtime env.
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    environment:
      # Server-only, read at RUNTIME ($env/dynamic/private). SvelteKit SSR → backend.
      - INTERNAL_API_URL=http://backend:5098
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "5098"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
