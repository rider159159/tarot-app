# Production stack for self-hosting on the OCI ARM (aarch64) machine.
# Dev stack lives in docker-compose.yml — do not mix the two.
#
# Reverse proxy lives in a separate repo: github.com/rider159159/oci-infra
# (Nginx container, owns 80/443, shares the external `web` Docker network).
# This stack only exposes the apps to the shared network; nginx connects in.
#
# Prerequisite (one-time on machine):
#   docker network create web
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env (never committed). See .env.example for required keys.

services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC_* are inlined into the SvelteKit bundle at BUILD time.
        # They must be passed as build args, not runtime env.
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    environment:
      # Server-only, read at RUNTIME ($env/dynamic/private). SvelteKit SSR → backend.
      - INTERNAL_API_URL=http://backend:5098
      # Tells SvelteKit's Node adapter the real public origin so its CSRF
      # check accepts form POSTs that come through the reverse proxy. Without
      # this, behind a proxy SvelteKit sees an internal host and rejects form
      # actions with 403 "Cross-site POST form submissions are forbidden".
      - ORIGIN=https://tarot.rydercloud.cc
    expose:
      - "3000"
    networks:
      - web
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "5098"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: web
