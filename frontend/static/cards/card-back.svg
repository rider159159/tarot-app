<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 380" width="220" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#0b0f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d2650"/>
      <stop offset="1" stop-color="#0b0f24"/>
    </radialGradient>
    <g id="star">
      <path d="M0,-9 L1.6,-1.6 L9,0 L1.6,1.6 L0,9 L-1.6,1.6 L-9,0 L-1.6,-1.6 Z" fill="#d9bd6e"/>
    </g>
    <g id="star-sm">
      <path d="M0,-5 L0.9,-0.9 L5,0 L0.9,0.9 L0,5 L-0.9,0.9 L-5,0 L-0.9,-0.9 Z" fill="#c9a85e"/>
    </g>
  </defs>

  <!-- 外白框 + 內深底 -->
  <rect x="0" y="0" width="220" height="380" rx="14" fill="#f4f2ec"/>
  <rect x="10" y="10" width="200" height="360" rx="8" fill="url(#bg)"/>
  <rect x="10" y="10" width="200" height="360" rx="8" fill="url(#glow)" opacity="0.7"/>

  <!-- 星點群 -->
  <g opacity="0.95">
    <use href="#star" x="48"  y="58"/>
    <use href="#star" x="150" y="92"/>
    <use href="#star" x="92"  y="150"/>
    <use href="#star" x="168" y="200"/>
    <use href="#star" x="56"  y="248"/>
    <use href="#star" x="120" y="300"/>
    <use href="#star" x="160" y="328"/>
    <use href="#star" x="72"  y="334"/>
  </g>
  <g opacity="0.8">
    <use href="#star-sm" x="78"  y="44"/>
    <use href="#star-sm" x="118" y="74"/>
    <use href="#star-sm" x="186" y="56"/>
    <use href="#star-sm" x="40"  y="108"/>
    <use href="#star-sm" x="138" y="128"/>
    <use href="#star-sm" x="178" y="146"/>
    <use href="#star-sm" x="60"  y="172"/>
    <use href="#star-sm" x="112" y="208"/>
    <use href="#star-sm" x="44"  y="208"/>
    <use href="#star-sm" x="146" y="244"/>
    <use href="#star-sm" x="88"  y="268"/>
    <use href="#star-sm" x="184" y="280"/>
    <use href="#star-sm" x="40"  y="296"/>
    <use href="#star-sm" x="156" y="300"/>
    <use href="#star-sm" x="100" y="340"/>
  </g>
  <g fill="#b89a52" opacity="0.55">
    <circle cx="100" cy="100" r="1.4"/>
    <circle cx="64"  cy="140" r="1.4"/>
    <circle cx="150" cy="170" r="1.4"/>
    <circle cx="84"  cy="220" r="1.4"/>
    <circle cx="130" cy="256" r="1.4"/>
    <circle cx="170" cy="116" r="1.4"/>
    <circle cx="52"  cy="320" r="1.4"/>
  </g>
</svg>
